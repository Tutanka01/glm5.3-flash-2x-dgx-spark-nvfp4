name: glm53

services:
  sglang-glm53:
    image: ${GLM53_RUNTIME_IMAGE:?GLM53_RUNTIME_IMAGE must be set}
    pull_policy: if_not_present
    network_mode: host
    ipc: host
    shm_size: "64gb"

    # GB10 exposes one unified CPU/GPU memory pool. Equal hard and swap limits
    # keep a failed load from turning into host-wide swap thrashing.
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-120g}
    memswap_limit: ${CONTAINER_MEMORY_LIMIT:-120g}
    restart: "${RESTART_POLICY:-no}"
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}

    ulimits:
      memlock: -1
      stack: 67108864

    cap_add:
      - IPC_LOCK
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:?HF_CACHE must be set}:/cache/huggingface

    environment:
      HOME: /root
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /cache/huggingface/sglang-cache
      SGLANG_CACHE_DIR: /cache/huggingface/sglang-cache
      TRITON_CACHE_DIR: /cache/huggingface/triton-cache
      TORCH_EXTENSIONS_DIR: /cache/huggingface/torch-extensions
      CUDA_CACHE_PATH: /cache/huggingface/cuda-cache

      MODEL_SNAPSHOT_CONTAINER: "${MODEL_SNAPSHOT_CONTAINER}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-glm-5.3-flash-nvfp4}"
      API_HOST: "${API_HOST:-0.0.0.0}"
      API_PORT: "${API_PORT:-8888}"
      API_KEY: "${API_KEY:-}"

      NODE_RANK: "${NODE_RANK:-0}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-32768}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-1}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-4096}"
      MEM_FRACTION_STATIC: "${MEM_FRACTION_STATIC:-0.90}"
      KV_CACHE_DTYPE: "${KV_CACHE_DTYPE:-fp8_e4m3}"
      MOE_BACKEND: "${MOE_BACKEND:-flashinfer_cutlass}"
      DSA_PREFILL_BACKEND: "${DSA_PREFILL_BACKEND:-flashinfer_sparse_mla}"
      DSA_DECODE_BACKEND: "${DSA_DECODE_BACKEND:-flashinfer_sparse_mla}"
      CUDA_GRAPH_MAX_BS: "${CUDA_GRAPH_MAX_BS:-1}"
      DISABLE_CUDA_GRAPH: "${DISABLE_CUDA_GRAPH:-0}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-0}"

      # Optional optimization experiments (docs/OPTIMIZATION.md). The defaults
      # reproduce the validated recipe behavior exactly.
      EP_SIZE: "${EP_SIZE:-2}"
      ENABLE_TORCH_COMPILE: "${ENABLE_TORCH_COMPILE:-0}"
      TORCH_COMPILE_MAX_BS: "${TORCH_COMPILE_MAX_BS:-4}"
      ENABLE_MIXED_CHUNK: "${ENABLE_MIXED_CHUNK:-0}"
      SCHEDULE_CONSERVATIVENESS: "${SCHEDULE_CONSERVATIVENESS:-1.0}"
      ENABLE_PREFILL_CP: "${ENABLE_PREFILL_CP:-0}"
      ATTN_CP_SIZE: "${ATTN_CP_SIZE:-1}"
      CP_STRATEGY: "${CP_STRATEGY:-interleave}"

      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      CUTE_DSL_ARCH: sm_121a
      SGLANG_OPT_USE_TOPK_V2: "0"
      SGLANG_OPT_USE_TILELANG_INDEXER: "1"
      SGLANG_FP8_PAGED_MQA_LOGITS_TORCH: "1"
      SGLANG_OPT_DEEPGEMM_HC_PRENORM: "0"
      SGLANG_OPT_FP8_WO_A_GEMM: "0"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ADDR_RANGE: "${NCCL_IB_ADDR_RANGE}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      NCCL_MAX_NCHANNELS: "${NCCL_MAX_NCHANNELS:-4}"
      NCCL_MIN_NCHANNELS: "${NCCL_MIN_NCHANNELS:-4}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      # Optional fabric experiments. Empty values are unset by the entrypoint
      # so NCCL keeps its stock defaults unless a knob is configured.
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-}"
      NCCL_IB_QPS_PER_CONNECTION: "${NCCL_IB_QPS_PER_CONNECTION:-}"
      NCCL_NET_GDR_LEVEL: "${NCCL_NET_GDR_LEVEL:-}"
      NCCL_DMABUF_ENABLE: "${NCCL_DMABUF_ENABLE:-}"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$$HEADLESS" = "1" ]; then
            kill -0 1;
          elif [ -n "$$API_KEY" ]; then
            curl -fsS --connect-timeout 2 --max-time 10
            -H "Authorization: Bearer $$API_KEY"
            "http://127.0.0.1:$${API_PORT}/v1/models" >/dev/null;
          else
            curl -fsS --connect-timeout 2 --max-time 10
            "http://127.0.0.1:$${API_PORT}/v1/models" >/dev/null;
          fi
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: ${HEALTH_START_PERIOD:-3600s}

    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail

        case "$${DISABLE_CUDA_GRAPH}" in 0|1) ;; *) echo "DISABLE_CUDA_GRAPH must be 0 or 1" >&2; exit 2 ;; esac
        case "$${MTP_NUM_TOKENS}" in ''|*[!0-9]*) echo "MTP_NUM_TOKENS must be a non-negative integer" >&2; exit 2 ;; esac
        case "$${EP_SIZE:-2}" in 1|2) ;; *) echo "EP_SIZE must be 1 or 2 for this TP=2 recipe" >&2; exit 2 ;; esac
        case "$${ENABLE_TORCH_COMPILE:-0}" in 0|1) ;; *) echo "ENABLE_TORCH_COMPILE must be 0 or 1" >&2; exit 2 ;; esac
        case "$${TORCH_COMPILE_MAX_BS:-4}" in ''|*[!0-9]*) echo "TORCH_COMPILE_MAX_BS must be a non-negative integer" >&2; exit 2 ;; esac
        case "$${ENABLE_MIXED_CHUNK:-0}" in 0|1) ;; *) echo "ENABLE_MIXED_CHUNK must be 0 or 1" >&2; exit 2 ;; esac
        case "$${ENABLE_PREFILL_CP:-0}" in 0|1) ;; *) echo "ENABLE_PREFILL_CP must be 0 or 1" >&2; exit 2 ;; esac
        case "$${ATTN_CP_SIZE:-1}" in 1|2) ;; *) echo "ATTN_CP_SIZE must be 1 or 2 for this TP=2 recipe" >&2; exit 2 ;; esac
        case "$${CP_STRATEGY:-interleave}" in interleave|zigzag) ;; *) echo "CP_STRATEGY must be interleave or zigzag" >&2; exit 2 ;; esac

        # Optional NCCL experiments: unset empty values so NCCL keeps the
        # stock defaults validated by this recipe.
        for knob in NCCL_IB_MERGE_NICS NCCL_IB_QPS_PER_CONNECTION NCCL_NET_GDR_LEVEL NCCL_DMABUF_ENABLE; do
          if [ -z "$${!knob:-}" ]; then
            unset "$$knob"
          fi
        done

        args=(
          --model-path "$${MODEL_SNAPSHOT_CONTAINER}"
          --served-model-name "$${SERVED_MODEL_NAME}"
          --host "$${API_HOST}"
          --port "$${API_PORT}"
          --tp-size 2
          --ep-size "$${EP_SIZE:-2}"
          --nnodes 2
          --node-rank "$${NODE_RANK}"
          --dist-init-addr "$${MASTER_ADDR}:$${MASTER_PORT}"
          --context-length "$${MAX_MODEL_LEN}"
          --quantization modelopt_fp4
          --attention-backend dsa
          --dsa-prefill-backend "$${DSA_PREFILL_BACKEND}"
          --dsa-decode-backend "$${DSA_DECODE_BACKEND}"
          --linear-attn-backend triton
          --kv-cache-dtype "$${KV_CACHE_DTYPE}"
          --moe-runner-backend "$${MOE_BACKEND}"
          --disable-shared-experts-fusion
          --chunked-prefill-size "$${MAX_NUM_BATCHED_TOKENS}"
          --max-prefill-tokens "$${MAX_NUM_BATCHED_TOKENS}"
          --max-running-requests "$${MAX_NUM_SEQS}"
          --mem-fraction-static "$${MEM_FRACTION_STATIC}"
          --cuda-graph-max-bs-decode "$${CUDA_GRAPH_MAX_BS}"
          --media-url-max-file-size-mb 1024
          --enable-multimodal
          --reasoning-parser glm45
          --tool-call-parser glm47
        )

        if [ -n "$${API_KEY}" ]; then
          args+=(--api-key "$${API_KEY}")
        fi
        if [ "$${DISABLE_CUDA_GRAPH}" = "1" ]; then
          args+=(--disable-cuda-graph)
        fi
        if [ "$${MTP_NUM_TOKENS}" -gt 0 ]; then
          draft_tokens=$((MTP_NUM_TOKENS + 1))
          args+=(
            --speculative-algorithm NEXTN
            --speculative-num-steps "$${MTP_NUM_TOKENS}"
            --speculative-eagle-topk 1
            --speculative-num-draft-tokens "$${draft_tokens}"
            --speculative-adaptive
          )
        fi
        args+=(--schedule-conservativeness "$${SCHEDULE_CONSERVATIVENESS:-1.0}")
        if [ "$${ENABLE_TORCH_COMPILE:-0}" = "1" ]; then
          args+=(--enable-torch-compile --torch-compile-max-bs "$${TORCH_COMPILE_MAX_BS:-4}")
        fi
        if [ "$${ENABLE_MIXED_CHUNK:-0}" = "1" ]; then
          args+=(--enable-mixed-chunk)
        fi
        if [ "$${ENABLE_PREFILL_CP:-0}" = "1" ]; then
          args+=(
            --enable-prefill-cp
            --attn-cp-size "$${ATTN_CP_SIZE:-2}"
            --cp-strategy "$${CP_STRATEGY:-interleave}"
          )
        fi

        printf 'Starting SGLang GLM-5.3 rank=%s context=%s MoE=%s DSA=%s/%s EP=%s graphs-disabled=%s MTP=%s prefill-CP=%s/%s/%s\n' \
          "$${NODE_RANK}" "$${MAX_MODEL_LEN}" "$${MOE_BACKEND}" \
          "$${DSA_PREFILL_BACKEND}" "$${DSA_DECODE_BACKEND}" \
          "$${EP_SIZE:-2}" "$${DISABLE_CUDA_GRAPH}" "$${MTP_NUM_TOKENS}" \
          "$${ENABLE_PREFILL_CP:-0}" "$${ATTN_CP_SIZE:-1}" "$${CP_STRATEGY:-interleave}"
        exec python3 -m sglang.launch_server "$${args[@]}"
