name: glm53

services:
  vllm-glm53:
    image: ${GLM53_VLLM_IMAGE:?GLM53_VLLM_IMAGE must be set}
    pull_policy: if_not_present
    network_mode: host
    ipc: host
    shm_size: "64gb"

    # GB10 uses one unified CPU/GPU memory pool. These equal limits prevent a
    # Marlin repack overcommit from turning into host swap thrash.
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-112g}
    memswap_limit: ${CONTAINER_MEMORY_LIMIT:-112g}
    restart: "${RESTART_POLICY:-no}"
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:?HF_CACHE must be set}:/cache/huggingface

    environment:
      HOME: /root
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-1800}"
      HF_HUB_ETAG_TIMEOUT: "${HF_HUB_ETAG_TIMEOUT:-60}"
      HF_TOKEN: "${HF_TOKEN:-}"
      TOKENIZERS_PARALLELISM: "false"

      MODEL_ID: "${MODEL_ID}"
      MODEL_REVISION: "${MODEL_REVISION}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-glm-5.3-flash-nvfp4}"
      VLLM_HOST: "${VLLM_HOST:-0.0.0.0}"
      VLLM_PORT: "${VLLM_PORT:-8888}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_LOGGING_LEVEL: "${VLLM_LOGGING_LEVEL:-INFO}"
      TRITON_CACHE_DIR: /cache/huggingface/triton-cache
      TORCH_EXTENSIONS_DIR: /cache/huggingface/torch-extensions
      CUDA_CACHE_PATH: /cache/huggingface/cuda-cache
      CUDA_DEVICE_ORDER: PCI_BUS_ID

      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-32768}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-1}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-4096}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.88}"
      KV_CACHE_DTYPE: "${KV_CACHE_DTYPE:-fp8}"
      MOE_BACKEND: "${MOE_BACKEND:-marlin}"
      ENFORCE_EAGER: "${ENFORCE_EAGER:-1}"
      ENABLE_CHUNKED_PREFILL: "${ENABLE_CHUNKED_PREFILL:-1}"
      ENABLE_PREFIX_CACHING: "${ENABLE_PREFIX_CACHING:-0}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-0}"

      NODE_RANK: "${NODE_RANK:-0}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$$HEADLESS" = "1" ]; then
            kill -0 1;
          else
            curl -fsS "http://127.0.0.1:$${VLLM_PORT}/health" >/dev/null;
          fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: ${HEALTH_START_PERIOD:-3600s}

    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail

        case "$${ENFORCE_EAGER}" in 0|1) ;; *) echo "ENFORCE_EAGER must be 0 or 1" >&2; exit 2 ;; esac
        case "$${ENABLE_CHUNKED_PREFILL}" in 0|1) ;; *) echo "ENABLE_CHUNKED_PREFILL must be 0 or 1" >&2; exit 2 ;; esac
        case "$${ENABLE_PREFIX_CACHING}" in 0|1) ;; *) echo "ENABLE_PREFIX_CACHING must be 0 or 1" >&2; exit 2 ;; esac
        case "$${MTP_NUM_TOKENS}" in ''|*[!0-9]*) echo "MTP_NUM_TOKENS must be a non-negative integer" >&2; exit 2 ;; esac

        args=(
          --served-model-name "$${SERVED_MODEL_NAME}"
          --host "$${VLLM_HOST}"
          --port "$${VLLM_PORT}"
          --revision "$${MODEL_REVISION}"
          --dtype bfloat16
          --tensor-parallel-size 2
          --pipeline-parallel-size 1
          --distributed-executor-backend mp
          --nnodes 2
          --node-rank "$${NODE_RANK}"
          --master-addr "$${MASTER_ADDR}"
          --master-port "$${MASTER_PORT}"
          --kv-cache-dtype "$${KV_CACHE_DTYPE}"
          --max-model-len "$${MAX_MODEL_LEN}"
          --max-num-seqs "$${MAX_NUM_SEQS}"
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS}"
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}"
          --swap-space 0
          --cpu-offload-gb 0
          --tool-call-parser glm47
          --enable-auto-tool-choice
          --reasoning-parser glm45
          --generation-config vllm
        )

        if [ "$${MOE_BACKEND}" != "auto" ]; then
          args+=(--moe-backend "$${MOE_BACKEND}")
        fi
        if [ "$${ENFORCE_EAGER}" = "1" ]; then
          args+=(--enforce-eager)
        fi
        if [ "$${ENABLE_CHUNKED_PREFILL}" = "1" ]; then
          args+=(--enable-chunked-prefill)
        fi
        if [ "$${ENABLE_PREFIX_CACHING}" = "1" ]; then
          args+=(--enable-prefix-caching)
        fi
        if [ "$${MTP_NUM_TOKENS}" -gt 0 ]; then
          args+=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS}}")
        fi
        if [ "$${HEADLESS}" = "1" ]; then
          args+=(--headless)
        fi

        printf 'Starting GLM-5.3 rank=%s profile=%s backend=%s eager=%s mtp=%s\n' \
          "$${NODE_RANK}" "$${MAX_MODEL_LEN}" "$${MOE_BACKEND}" "$${ENFORCE_EAGER}" "$${MTP_NUM_TOKENS}"
        exec vllm serve "$${MODEL_ID}" "$${args[@]}"
